[project]
name = "fenix-research"
version = "0.1.0"
description = "Evidence-first workload characterization for FENIX"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["analysis", "instrumentation", "scripts"]
